<article class="card">
  <div class="card-top">
    <div class="code-meta"><span class="code-chip">{{ course().code }}</span><span class="level">{{ course().category }}</span></div>
    <span
      class="tms-badge"
      [class.tms-badge--approved]="!isFull()"
      [class.tms-badge--rejected]="isFull()"
    >
      {{ isFull() ? 'Full' : 'Open' }}
    </span>
  </div>

  <h3 class="card-title">
    <a [routerLink]="['/courses', course().id]">{{ course().title }}</a>
  </h3>
  <p class="card-description">{{ course().description }}</p>
  <div class="card-meta"><span><span class="material-icons">schedule</span> {{ course().duration }}</span><span><span class="material-icons">event_available</span> {{ course().status }}</span></div>

  <div class="capacity">
    <div class="bar">
      <div class="bar-fill" [class.bar-fill--full]="isFull()" [style.width.%]="fillPct()"></div>
    </div>
    <span class="cap-text tms-muted">
       {{ course().maxCapacity - course().enrollmentCount }} seats available
    </span>
  </div>

  <div class="card-actions">
    <a class="tms-btn tms-btn--ghost" [routerLink]="['/courses', course().id]">Details</a>
    <button
      class="tms-btn tms-btn--primary"
      (click)="enrollClicked.emit(course())"
      [disabled]="isFull()"
    >
      Enroll
    </button>
  </div>
</article>
