<div class="list-card">
  @if (store.error(); as err) {
    <div class="list-alert" role="alert">
      <span class="material-icons">error_outline</span> {{ err }}
    </div>
  }

  @if (store.isLoading()) {
    <div class="list-loading"><span class="spinner"></span> Loading enrollments…</div>
  }

  <div class="table-scroll">
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- Student -->
      <ng-container matColumnDef="studentName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Student</th>
        <td mat-cell *matCellDef="let row">
          <div class="cell-strong">{{ row.studentName }}</div>
        </td>
      </ng-container>

      <!-- Course -->
      <ng-container matColumnDef="courseName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Course</th>
        <td mat-cell *matCellDef="let row">
          <div class="cell-strong">{{ row.courseName }}</div>
          <div class="cell-sub">{{ row.courseCode }}</div>
        </td>
      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let row">
          <span
            class="tms-badge"
            [class.tms-badge--pending]="row.status === 'Pending'"
            [class.tms-badge--approved]="row.status === 'Approved'"
            [class.tms-badge--rejected]="row.status === 'Rejected'"
          >
            {{ row.status }}
          </span>
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          @if (row.status === 'Pending') {
            <div class="row-actions">
              <button class="tms-btn tms-btn--primary sm" (click)="approve(row)">Approve</button>
              <button class="tms-btn tms-btn--danger sm" (click)="reject(row)">Reject</button>
            </div>
          } @else {
            <span class="tms-muted decided">Decided</span>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
</div>
